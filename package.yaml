name:                deltafetch
version:             1.0.0
github:              "ruzen42/deltafetch"
license:             BSD-3-Clause
maintainer:          "ruzen@tuta.io"

extra-source-files:
- README.md
- CHANGELOG.md

category:            System

description:         Please see the README on GitHub at <https://github.com/ruzen42/deltafetch#readme>

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - text
  - directory
  - text-show
  - unix
  c-sources:
  - cbits/sysctl_cpu.c 
  include-dirs:
    cbits

executables:
  deltafetch:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - deltafetch
    - optparse-applicative
    - text
    - async

tests:
  deltafetch-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - deltafetch
